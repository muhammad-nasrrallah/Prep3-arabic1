    /* ==================== PROFESSIONAL 3D FLIP CARDS & SHEEN SWEEP ==================== */
    .flip-scene {
      perspective: 1200px;
      position: relative;
    }

    .flip-lift-wrap {
      transform-style: preserve-3d;
      will-change: transform;
    }

    @keyframes cardLiftBounce {
      0%   { transform: translateY(0) scale(1); }
      45%  { transform: translateY(-9px) scale(1.028); }
      100% { transform: translateY(0) scale(1); }
    }

    .flip-lift-wrap.is-lifting {
      animation: cardLiftBounce 0.68s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .flip-card {
      display: grid;
      width: 100%;
      min-height: 334px;
      transform-style: preserve-3d;
      transition: transform 0.68s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.45s ease;
      cursor: pointer;
      border-radius: 1.125rem;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      will-change: transform;
    }

    .flip-card.grid-flip-card {
      min-height: 274px;
    }

    .flip-card.is-flipped {
      transform: rotateY(180deg) scale(1.015);
    }

    .flip-lift-wrap.is-lifting .flip-card {
      box-shadow: 0 20px 38px rgba(26, 35, 81, 0.13);
    }

    .flip-face {
      grid-area: 1 / 1;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 1.125rem;
      overflow: hidden;
      position: relative;
    }

    .flip-front {
      transform: rotateY(0deg);
    }

    .flip-back {
      transform: rotateY(180deg);
    }

    /* Subtle light sheen sweeping across the card during rotation */
    .flip-face::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        112deg,
        transparent 22%,
        rgba(255, 255, 255, 0.48) 48%,
        transparent 74%
      );
      transform: translateX(130%);
      opacity: 0;
    }

    @keyframes sheenSweep {
      0%   { transform: translateX(130%); opacity: 0; }
      25%  { opacity: 0.9; }
      100% { transform: translateX(-130%); opacity: 0; }
    }

    .flip-lift-wrap.is-lifting .flip-face::after {
      animation: sheenSweep 0.68s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Layered Colorful Peeking Cards Behind Active Deck Card */
    .deck-stack-layer {
      position: absolute;
      inset: 0;
      border-radius: 1.125rem;
      pointer-events: none;
      transition: transform 0.48s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    }
    .deck-stack-1 {
      transform: translate(-10px, 10px) scale(0.965);
      z-index: 1;
    }
    .deck-stack-2 {
      transform: translate(-20px, 20px) scale(0.93);
      z-index: 0;
    }
    .deck-stage-active {
      position: relative;
      z-index: 2;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .deck-nudge .deck-stack-1 {
      transform: translate(-14px, 14px) scale(0.955);
    }
    .deck-nudge .deck-stack-2 {
      transform: translate(-26px, 25px) scale(0.915);
    }

    /* Directional Card Slide Transitions */
    @keyframes slideOutNext {
      from { opacity: 1; transform: translateX(0) rotate(0deg); }
      to   { opacity: 0; transform: translateX(-36px) rotate(-1.4deg); }
    }
    @keyframes slideOutPrev {
      from { opacity: 1; transform: translateX(0) rotate(0deg); }
      to   { opacity: 0; transform: translateX(36px) rotate(1.4deg); }
    }
    @keyframes slideInNext {
      from { opacity: 0; transform: translateX(34px) scale(0.97); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes slideInPrev {
      from { opacity: 0; transform: translateX(-34px) scale(0.97); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }

    .anim-slide-out-next { animation: slideOutNext 0.17s ease-in forwards; }
    .anim-slide-out-prev { animation: slideOutPrev 0.17s ease-in forwards; }
    .anim-slide-in-next  { animation: slideInNext 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .anim-slide-in-prev  { animation: slideInPrev 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }

    /* =========================================================================
       4. GENTLE WEB AUDIO API SYNTHESIZER (NO EXTERNAL FILES, TRIGGERED ON CLICK)
       ========================================================================= */
    let audioCtx = null;

    function getAudioCtx() {
      if (state.muted) return null;
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return null;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      } catch (e) {
        return null;
      }
    }

    // Soft realistic paper-flip whoosh & muted wooden click
    function playFlipSound() {
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;

        // Filtered gentle paper rustle (70ms)
        const bufferSize = Math.floor(ctx.sampleRate * 0.07);
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          const env = Math.sin((i / bufferSize) * Math.PI);
          data[i] = (Math.random() * 2 - 1) * env * 0.32;
        }
        const noise = ctx.createBufferSource();
        noise.buffer = noiseBuffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1100, now);
        filter.Q.setValueAtTime(1.1, now);

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.055, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noise.start(now);

        // Soft muted click
        const osc = ctx.createOscillator();
        const tickGain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(290, now);
        osc.frequency.exponentialRampToValueAtTime(145, now + 0.045);
        tickGain.gain.setValueAtTime(0.0001, now);
        tickGain.gain.exponentialRampToValueAtTime(0.042, now + 0.008);
        tickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.052);
        osc.connect(tickGain);
        tickGain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.058);
      } catch (e) {}
    }

    // Pleasant chime on correct answer
    function playCorrectSound() {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const notes = [523.25, 659.25];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.09);
        gain.gain.setValueAtTime(0.0001, now + i * 0.09);
        gain.gain.exponentialRampToValueAtTime(0.075, now + i * 0.09 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.09 + 0.34);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.09);
        osc.stop(now + i * 0.09 + 0.37);
      });
    }

      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const chord = [392.0, 493.88, 587.33, 783.99];

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        const start = now + idx * 0.08;
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.06, start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.65);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.68);
      });
    }

    let toastTimer = null;
    function showToast(message, icon = 'ph-check-circle') {
      const container = document.getElementById('toast-container');
      const msgEl = document.getElementById('toast-message');
      const iconEl = document.getElementById('toast-icon');
      if (!container || !msgEl) return;

      msgEl.textContent = message;
      iconEl.className = `ph ${icon} text-base`;
      container.classList.remove('opacity-0', 'translate-y-2');
      container.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        container.classList.remove('opacity-100', 'translate-y-0');
        container.classList.add('opacity-0', 'translate-y-2');
      }, 2400);
    }

    function toArabicDigits(num) {
      const digits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
      return String(num).replace(/\d/g, d => digits[Number(d)]);
    }

    function isQuestionSolved(q) {
      if (q.type === 'mcq') return state.mcqAnswers[q.id] !== undefined;
      return state.essayStatus[q.id] !== undefined;
    }

    function getStationStats(station) {
      let total = 0;
      let solved = 0;
      station.sections.forEach(sec => {
        sec.questions.forEach(q => {
          total++;
          if (isQuestionSolved(q)) solved++;
        });
      });
      const isCompleted = state.completedStations.includes(station.id);
      let status = 'not_started';
      if (isCompleted) status = 'completed';
      else if (solved > 0) status = 'in_progress';
      return { total, solved, isCompleted, status };
    }

    function getSavedReviewIds() {
      const set = new Set(state.bookmarks);
      Object.entries(state.essayStatus).forEach(([qId, status]) => {
        if (status === 'review') set.add(qId);
      });
      return Array.from(set);
    }

    function getOverallProgress() {
      const totalQ = ALL_QUESTIONS.length;
      const solvedQ = ALL_QUESTIONS.filter(isQuestionSolved).length;
      const completedSt = state.completedStations.length;
      const pct = Math.round(((solvedQ / totalQ) * 0.7 + (completedSt / STATIONS.length) * 0.3) * 100);
      return {
        totalQ,
        solvedQ,
        completedSt,
        totalSt: STATIONS.length,
        savedCount: getSavedReviewIds().length,
        percent: Math.min(100, pct)
      };
    }

    function updateGlobalChrome() {
      const prog = getOverallProgress();
      const bar = document.getElementById('header-progress-bar');
      const txt = document.getElementById('header-progress-text');
      const muteIcon = document.getElementById('mute-icon');
      const dDot = document.getElementById('desktop-bookmark-dot');
      const mDot = document.getElementById('mobile-bookmark-dot');

      if (bar) bar.style.width = `${prog.percent}%`;
      if (txt) txt.textContent = `${prog.percent}%`;
      if (muteIcon) {
        muteIcon.className = state.muted ? 'ph ph-speaker-slash text-lg' : 'ph ph-speaker-high text-lg';
      }
      const hasSaved = prog.savedCount > 0;
      if (dDot) dDot.classList.toggle('hidden', !hasSaved);
      if (mDot) mDot.classList.toggle('hidden', !hasSaved);

      document.querySelectorAll('.desktop-nav-btn').forEach(btn => {
        const active = btn.dataset.nav === state.currentView;
        btn.className = `desktop-nav-btn flex items-center justify-center gap-2 py-2 px-3 rounded-xl text-sm font-semibold transition-colors relative ${
          active ? 'bg-accentSoft text-accent' : 'text-slateCalm hover:text-ink hover:bg-paper'

      document.querySelectorAll('.mobile-nav-btn').forEach(btn => {

                              <span>فتح</span>
                              <i class="ph ph-arrow-left text-sm group-hover:-translate-x-0.5 transition-transform"></i>
                            </span>
                          </div>
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </section>

          <!-- Reset Progress Section (Inline Confirmation — NO confirm() dialog) -->
          <section class="pt-4 border-t border-borderWarm flex flex-wrap items-center justify-between gap-3">
            <p class="text-xs text-slateCalm">يُحفظ تقدمك وإجاباتك تلقائيًا على هذا الجهاز.</p>
            ${uiState.confirmReset ? `
              <div class="flex items-center gap-2 bg-dangerSoft border border-danger/25 rounded-xl px-3 py-2">
                <span class="text-xs font-semibold text-danger">هل تؤكد مسح كل التقدم؟</span>
                <button onclick="performResetProgress()" class="px-3 py-1.5 rounded-lg bg-danger text-surface text-xs font-semibold">نعم، إعادة الضبط</button>
                <button onclick="toggleResetConfirm(false)" class="px-3 py-1.5 rounded-lg bg-surface border border-borderWarm text-ink text-xs font-semibold">إلغاء</button>
              </div>
            ` : `
              <button onclick="toggleResetConfirm(true)" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slateCalm hover:text-danger transition-colors py-2 px-3 rounded-lg hover:bg-dangerSoft">
                <i class="ph ph-arrow-counter-clockwise text-sm"></i>
                <span>إعادة ضبط التقدم</span>
              </button>
            `}
          </section>
        </div>
      `;
    }

    function stepPlanPreviewCard(delta) {
      playFlipSound();
      uiState.planPreviewCardIdx = (uiState.planPreviewCardIdx + delta + 5) % 5;
      renderApp();
    }

    function toggleResetConfirm(val) {
      uiState.confirmReset = val;
      renderApp();
    }

    function performResetProgress() {
      const keepMute = state.muted;
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      state.muted = keepMute;
      uiState.confirmReset = false;
      saveState();
      renderApp();
      showToast('تمت إعادة ضبط التقدم بنجاح', 'ph-arrow-counter-clockwise');
    }

    /* =========================================================================
       7. VIEW 2: STUDY STATION (المحطات التفاعلية)
       ========================================================================= */
    function renderStationView() {
      const station = STATIONS.find(s => s.id === state.currentStationId) || STATIONS[0];
      const stats = getStationStats(station);
      const nextStation = STATIONS.find(s => s.id === station.id + 1);

      return `
        <div class="view-enter space-y-6">
          <!-- Station Switcher Pills -->
          <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1" role="tablist" aria-label="التبديل بين المحطات">
            ${STATIONS.map(st => {
              const active = st.id === station.id;
              const done = state.completedStations.includes(st.id);
              return `
                <button
                  onclick="selectStation(${st.id})"
                  class="shrink-0 inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold border transition-colors min-h-[40px] ${
                    active
                      ? 'bg-accent text-surface border-accent'
                      : done
                        ? 'bg-successSoft text-success border-success/25 hover:border-success/50'
                        : 'bg-surface text-slateCalm border-borderWarm hover:text-ink hover:border-ink/25'
                  }"
                >
                  ${done && !active ? '<i class="ph ph-check-circle text-sm"></i>' : `<span>${toArabicDigits(st.id)}.</span>`}
                  <span>${st.shortTitle}</span>
                </button>
              `;
            }).join('')}
          </div>

          <!-- Station Header Card -->
          <div class="relative overflow-hidden bg-surface border border-borderWarm rounded-2xl p-5 shadow-calm">
            ${buildMoroccanWatermarkSvg(`st-head-geo-${station.id}`, '#1A2351', '0.035')}
            <div class="relative z-10">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-accentSoft text-accent text-xs font-semibold">
                  <i class="ph ${station.icon} text-sm"></i>
                  <span>${station.dayTitle} — المحطة ${toArabicDigits(station.id)}</span>
                </span>
                <span class="text-xs font-semibold ${stats.isCompleted ? 'text-success' : 'text-slateCalm'}">
                  ${toArabicDigits(stats.solved)} من ${toArabicDigits(stats.total)} أسئلة مجابة
                </span>
              </div>
              <h1 class="font-heading text-2xl sm:text-3xl font-bold text-ink">${station.title}</h1>
              <p class="text-sm text-slateCalm mt-1">${station.subtitle}</p>
            </div>
          </div>

          <!-- Collapsible Grammar Cheat Sheet (Station 5 Only) -->
          ${station.grammarCheatSheet ? `
            <div class="bg-amberSoft/70 border border-amberAccent/25 rounded-2xl overflow-hidden">
              <button
                onclick="toggleGrammarSheet()"
                class="w-full px-5 py-4 flex items-center justify-between gap-3 text-right min-h-[52px]"
              >
                <div class="flex items-center gap-2.5">
                  <span class="w-8 h-8 rounded-lg bg-amberSoft text-amberAccent flex items-center justify-center border border-amberAccent/20 shrink-0">
                    <i class="ph ph-sparkle text-lg"></i>
                  </span>
                  <div>
                    <div class="font-heading text-lg font-bold text-ink">ملخص القواعد السريعة للنموذجين</div>
                    <div class="text-xs text-slateCalm">راجع قواعد المشتقات والإعراب المتكررة قبل الحل</div>
                  </div>
                </div>
                <i class="ph ${uiState.grammarOpen ? 'ph-caret-up' : 'ph-caret-down'} text-lg text-amberAccent shrink-0"></i>
              </button>
              ${uiState.grammarOpen ? `
                <div class="px-5 pb-5 pt-2 grid grid-cols-1 sm:grid-cols-2 gap-3 border-t border-amberAccent/15">
                  ${station.grammarCheatSheet.map(item => `
                    <div class="bg-surface border border-borderWarm rounded-xl p-3.5">
                      <div class="text-xs font-bold text-accent mb-1">${item.title}</div>
                      <p class="text-xs sm:text-sm text-bodyInk leading-relaxed">${item.rule}</p>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          ` : ''}

          <!-- Station Sections (Passages / Poems + Questions) -->
          ${station.sections.map(sec => `
            <section class="space-y-4">
              <!-- Source Material Box -->
              ${sec.type === 'passage' ? `
                <div class="bg-surface border border-borderWarm rounded-2xl p-5 sm:p-6 shadow-calm">
                  <div class="flex items-center gap-2 text-xs font-bold text-accent mb-3 pb-2.5 border-b border-borderWarm/70">
                    <i class="ph ph-article text-base"></i>
                    <span>${sec.label}</span>
                  </div>
                  <p class="reading-passage text-bodyInk text-justify">${sec.text}</p>
                </div>
              ` : sec.type === 'poem' ? `
                <div class="bg-surface border border-borderWarm rounded-2xl p-5 sm:p-6 shadow-calm">
                  <div class="flex items-center gap-2 text-xs font-bold text-accent mb-4 pb-2.5 border-b border-borderWarm/70">
                    <i class="ph ph-feather text-base"></i>
                    <span>${sec.label}</span>
                  </div>
                  <div class="space-y-3 py-1">
                    ${sec.verses.map(v => `
                      <div class="poetry-line grid grid-cols-1 sm:grid-cols-2 gap-1 sm:gap-6 text-ink bg-paper/80 border border-borderWarm/70 rounded-xl px-4 py-2.5">
                        <div class="text-right">${v[0]}</div>
                        <div class="text-left sm:text-right">${v[1]}</div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : `
                <div class="flex items-center gap-2 text-sm font-bold text-ink pt-1">
                  <i class="ph ph-list-checks text-accent text-lg"></i>
                  <span>${sec.label}</span>
                </div>
              `}

              <!-- Questions List -->
              <div class="space-y-4">
                ${sec.questions.map((q, qIdx) => renderQuestionCard(q, qIdx + 1)).join('')}
              </div>
            </section>
          `).join('')}

          <!-- Station 6 Interactive Writing, Calligraphy & Dictation Guides -->
          ${station.writingGuides ? renderWritingGuides(station.writingGuides) : ''}

          <!-- Complete Station Action Footer -->
          <div class="bg-surface border border-borderWarm rounded-2xl p-5 shadow-calm flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-center sm:text-right">
              <div class="font-heading text-xl font-bold text-ink">
                ${stats.isCompleted ? 'أتممت هذه المحطة بنجاح' : 'هل انتهيت من مراجعة هذه المحطة؟'}
              </div>
              <p class="text-xs text-slateCalm mt-0.5">
                ${nextStation ? `المحطة التالية: ${nextStation.title}` : 'هذه آخر محطة — يمكنك الآن خوض الاختبار الشامل.'}
              </p>
            </div>
            <div class="flex flex-wrap items-center justify-center gap-2.5 w-full sm:w-auto">
              ${!stats.isCompleted ? `
                <button
                  onclick="completeCurrentStation(${station.id}, ${nextStation ? nextStation.id : 'null'})"
                  class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-accent text-surface text-sm font-semibold hover:opacity-95 transition-opacity min-h-[48px]"
                >
                  <i class="ph ph-check-circle text-lg"></i>
                  <span>${nextStation ? 'إتمام المحطة والانتقال للتالية' : 'إتمام المحطة الأخيرة'}</span>
                </button>
              ` : `
                <button
                  onclick="${nextStation ? `selectStation(${nextStation.id})` : `switchView('quiz')`}"
                  class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-success text-surface text-sm font-semibold hover:opacity-95 transition-opacity min-h-[48px]"
                >
                  <span>${nextStation ? 'الانتقال للمحطة التالية' : 'الانتقال للاختبار الشامل'}</span>
                  <i class="ph ph-arrow-left text-lg"></i>
                </button>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function renderQuestionCard(q, displayNum) {
      const isBookmarked = state.bookmarks.includes(q.id);
      const arabicLetters = ['أ', 'ب', 'ج', 'د'];

      if (q.type === 'mcq') {
        const chosen = state.mcqAnswers[q.id];
        const answered = chosen !== undefined;
        const isCorrect = answered && chosen === q.correctIndex;

        return `
          <article id="q-card-${q.id}" class="bg-surface border border-borderWarm rounded-2xl p-4 sm:p-5 shadow-calm space-y-4">
            <div class="flex items-start justify-between gap-3">
              <div class="flex items-start gap-2.5">
                <span class="w-7 h-7 rounded-lg bg-accentSoft text-accent text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">${toArabicDigits(displayNum)}</span>
                <h3 class="text-sm sm:text-base font-semibold text-ink leading-relaxed">${q.prompt}</h3>
              </div>
              <button
                onclick="toggleBookmark('${q.id}')"
                class="w-10 h-10 rounded-xl border shrink-0 flex items-center justify-center transition-colors ${
                  isBookmarked
                    ? 'bg-amberSoft border-amberAccent/35 text-amberAccent'
                    : 'bg-paper border-borderWarm text-slateCalm hover:text-amberAccent'
                }"
                aria-label="حفظ السؤال للمراجعة"
                title="${isBookmarked ? 'محفوظ للمراجعة' : 'حفظ للمراجعة'}"
              >
                <i class="ph ${isBookmarked ? 'ph-bookmark-simple ph-fill' : 'ph-bookmark-simple'} text-lg"></i>
              </button>
            </div>

            <!-- Options Grid -->
            <div class="grid grid-cols-1 gap-2.5">
              ${q.options.map((opt, idx) => {
                let btnStyle = 'bg-paper border-borderWarm text-bodyInk hover:border-accent/50 hover:bg-accentSoft/40';
                let iconHtml = `<span class="w-7 h-7 rounded-lg bg-surface border border-borderWarm text-xs font-bold text-slateCalm flex items-center justify-center shrink-0">${arabicLetters[idx]}</span>`;

                if (answered) {
                  if (idx === q.correctIndex) {
                    btnStyle = 'bg-successSoft border-success/45 text-success font-semibold';
                    iconHtml = `<span class="w-7 h-7 rounded-lg bg-success text-surface text-xs font-bold flex items-center justify-center shrink-0"><i class="ph ph-check text-sm"></i></span>`;
                  } else if (idx === chosen && idx !== q.correctIndex) {
                    btnStyle = 'bg-dangerSoft border-danger/40 text-danger';
                    iconHtml = `<span class="w-7 h-7 rounded-lg bg-danger text-surface text-xs font-bold flex items-center justify-center shrink-0"><i class="ph ph-x text-sm"></i></span>`;
                  } else {
                    btnStyle = 'bg-paper/60 border-borderWarm/60 text-slateCalm opacity-75';
                  }
                }

                return `
                  <button
                    onclick="answerStationMcq('${q.id}', ${idx})"
                    class="w-full text-right px-3.5 py-3 rounded-xl border transition-all flex items-center gap-3 min-h-[48px] ${btnStyle}"
                  >
                    ${iconHtml}
                    <span class="text-sm leading-relaxed">${opt}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Instant Explanation -->
            ${answered ? `
              <div class="rounded-xl p-3.5 border text-sm leading-relaxed space-y-1 ${
                isCorrect
                  ? 'bg-successSoft/75 border-success/25 text-bodyInk'
                  : 'bg-dangerSoft/75 border-danger/25 text-bodyInk'
              }">
                <div class="font-bold flex items-center gap-1.5 ${isCorrect ? 'text-success' : 'text-danger'}">
                  <i class="ph ${isCorrect ? 'ph-check-circle' : 'ph-info'} text-base"></i>
                  <span>${isCorrect ? 'إجابة صحيحة — أحسنت التركيز' : 'حاول مراجعة الفكرة — إليك التوضيح الصحيح'}</span>
                </div>
                <p class="text-xs sm:text-sm text-bodyInk/90">${q.explanation}</p>
              </div>
            ` : ''}
          </article>
        `;
      }

      // Essay / Open-ended Card
      const isRevealed = !!state.revealedEssays[q.id];
      const selfStatus = state.essayStatus[q.id];
      const draftText = state.essayDrafts[q.id] || '';

      return `
        <article id="q-card-${q.id}" class="bg-surface border border-borderWarm rounded-2xl p-4 sm:p-5 shadow-calm space-y-4">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-start gap-2.5">
              <span class="w-7 h-7 rounded-lg bg-amberSoft text-amberAccent text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">${toArabicDigits(displayNum)}</span>
              <div class="space-y-1">
                <span class="inline-block px-2 py-0.5 rounded-md bg-paper border border-borderWarm text-[11px] font-semibold text-slateCalm">${q.tag || 'مقالي'}</span>
                <h3 class="text-sm sm:text-base font-semibold text-ink leading-relaxed">${q.prompt}</h3>
              </div>
            </div>
            <button
              onclick="toggleBookmark('${q.id}')"
              class="w-10 h-10 rounded-xl border shrink-0 flex items-center justify-center transition-colors ${
                isBookmarked
                  ? 'bg-amberSoft border-amberAccent/35 text-amberAccent'
                  : 'bg-paper border-borderWarm text-slateCalm hover:text-amberAccent'
              }"
              aria-label="حفظ السؤال للمراجعة"
              title="${isBookmarked ? 'محفوظ للمراجعة' : 'حفظ للمراجعة'}"
            >
              <i class="ph ${isBookmarked ? 'ph-bookmark-simple ph-fill' : 'ph-bookmark-simple'} text-lg"></i>
            </button>
          </div>

          <textarea
            rows="2"
            oninput="updateEssayDraft('${q.id}', this.value)"
            placeholder="اكتب إجابتك هنا للتدريب (اختياري) أو فكّر فيها قبل عرض الإجابة النموذجية..."
            class="w-full rounded-xl bg-paper border border-borderWarm px-3.5 py-2.5 text-sm text-bodyInk placeholder:text-slateCalm/70 resize-y focus:border-accent"
          >${escapeHtml(draftText)}</textarea>

          <div class="flex flex-wrap items-center justify-between gap-2">
            <button
              onclick="toggleRevealEssay('${q.id}')"
              class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border transition-colors min-h-[44px] ${
                isRevealed
                  ? 'bg-paper border-borderWarm text-slateCalm hover:text-ink'
                  : 'bg-accentSoft border-accent/20 text-accent hover:bg-accent hover:text-surface'
              }"
            >
              <i class="ph ${isRevealed ? 'ph-eye-slash' : 'ph-eye'} text-base"></i>
              <span>${isRevealed ? 'إخفاء الإجابة النموذجية' : 'عرض الإجابة النموذجية'}</span>
            </button>

            ${selfStatus ? `
              <span class="inline-flex items-center gap-1 text-xs font-semibold ${selfStatus === 'known' ? 'text-success' : 'text-amberAccent'}">
                <i class="ph ${selfStatus === 'known' ? 'ph-check-circle' : 'ph-clock-counter-clockwise'} text-sm"></i>
                <span>${selfStatus === 'known' ? 'تم إتقانها' : 'مضافة للمراجعة'}</span>
              </span>
            ` : ''}
          </div>

          ${isRevealed ? `
            <div class="rounded-xl bg-paper border border-accent/25 p-4 space-y-3.5">
              <div>
                <div class="text-xs font-bold text-accent mb-1 flex items-center gap-1.5">
                  <i class="ph ph-seal-check text-sm"></i>
                  <span>الإجابة النموذجية</span>
                </div>
                <p class="text-sm text-bodyInk leading-relaxed">${q.modelAnswer}</p>
              </div>

              <div class="pt-3 border-t border-borderWarm flex flex-wrap items-center gap-2">
                <span class="text-xs text-slateCalm ml-1">قيّم إجابتك:</span>
                <button
                  onclick="setEssayStatus('${q.id}', 'known')"
                  class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold border min-h-[40px] transition-colors ${
                    selfStatus === 'known'
                      ? 'bg-success text-surface border-success'
                      : 'bg-surface text-success border-success/30 hover:bg-successSoft'
                  }"
                >
                  <i class="ph ph-check text-sm"></i>
                  <span>أجبتها بنجاح</span>
                </button>
                <button
                  onclick="setEssayStatus('${q.id}', 'review')"
                  class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold border min-h-[40px] transition-colors ${
                    selfStatus === 'review'
                      ? 'bg-amberAccent text-surface border-amberAccent'
                      : 'bg-surface text-amberAccent border-amberAccent/35 hover:bg-amberSoft'
                  }"
                >
                  <i class="ph ph-bookmark-simple text-sm"></i>
                  <span>أحتاج مراجعتها</span>
                </button>
              </div>
            </div>
          ` : ''}
        </article>
      `;
    }

    function renderWritingGuides(guides) {
      return `
        <div class="space-y-6 pt-2">
          <!-- Functional Report Card -->
          <section class="bg-surface border border-borderWarm rounded-2xl p-5 sm:p-6 shadow-calm space-y-4">
            <div class="flex items-center gap-2 text-xs font-bold text-accent">
              <i class="ph ph-newspaper text-base"></i>
              <span>${guides.functional.title}</span>
            </div>
            <p class="text-sm font-semibold text-ink bg-paper border border-borderWarm rounded-xl p-3.5">
              الموضوع: ${guides.functional.topic}
            </p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${guides.functional.blueprint.map((b, idx) => `
                <div class="bg-paper/75 border border-borderWarm rounded-xl p-3.5">
                  <div class="text-xs font-bold text-accent mb-1">${toArabicDigits(idx + 1)}. ${b.part}</div>
                  <p class="text-xs sm:text-sm text-bodyInk leading-relaxed">${b.example}</p>
                </div>
              `).join('')}
            </div>
          </section>

          <!-- 4 Persuasive Essay Topics Accordion -->
          <section class="space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="font-heading text-xl font-bold text-ink flex items-center gap-2">
                <i class="ph ph-note-pencil text-accent text-xl shrink-0"></i>
                <span>موضوعات النص الإقناعي الأربعة (١٥ – ٢٠ سطرًا)</span>
              </h2>
            </div>
            <p class="text-xs text-slateCalm">اضغط على أي موضوع لعرض الحجج المنطقية والأمثلة الواقعية وعناصر الكتابة المقترحة.</p>

            <div class="space-y-2.5">
              ${guides.persuasiveTopics.map((t, i) => {
                const isOpen = uiState.openWritingTopic === t.id;
                return `
                  <div class="bg-surface border border-borderWarm rounded-2xl overflow-hidden shadow-calm">
                    <button
                      onclick="toggleWritingTopic('${t.id}')"
                      class="w-full px-4 sm:px-5 py-4 flex items-center justify-between gap-3 text-right min-h-[54px] hover:bg-paper/60 transition-colors"
                    >
                      <div class="flex items-center gap-3 min-w-0">
                        <span class="w-7 h-7 rounded-lg bg-accentSoft text-accent text-xs font-bold flex items-center justify-center shrink-0">${toArabicDigits(i + 1)}</span>
                        <div class="min-w-0">
                          <div class="text-sm font-bold text-ink">${t.title}</div>
                          <div class="text-[11px] text-slateCalm">${t.source}</div>
                        </div>
                      </div>
                      <i class="ph ${isOpen ? 'ph-caret-up' : 'ph-caret-down'} text-lg text-slateCalm shrink-0"></i>
                    </button>

                    ${isOpen ? `
                      <div class="px-4 sm:px-5 pb-5 pt-2 border-t border-borderWarm/70 space-y-3 text-sm">
                        <div class="bg-paper rounded-xl p-3 border border-borderWarm/70">
                          <span class="text-xs font-bold text-accent block mb-1">المقدمة:</span>
                          <p class="text-bodyInk leading-relaxed">${t.intro}</p>
                        </div>
                        <div class="bg-paper rounded-xl p-3 border border-borderWarm/70">
                          <span class="text-xs font-bold text-accent block mb-1.5">أهم الحجج المنطقية:</span>
                          <ul class="space-y-1.5 text-bodyInk">
                            ${t.arguments.map(arg => `
                              <li class="flex items-start gap-2">
                                <i class="ph ph-check text-success text-sm mt-1 shrink-0"></i>
                                <span class="leading-relaxed">${arg}</span>
                              </li>
                            `).join('')}
                          </ul>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div class="bg-amberSoft/60 rounded-xl p-3 border border-amberAccent/20">
                            <span class="text-xs font-bold text-amberAccent block mb-1">أمثلة واقعية:</span>
                            <p class="text-xs sm:text-sm text-bodyInk leading-relaxed">${t.examples}</p>
                          </div>
                          <div class="bg-successSoft/60 rounded-xl p-3 border border-success/20">
                            <span class="text-xs font-bold text-success block mb-1">الخاتمة:</span>
                            <p class="text-xs sm:text-sm text-bodyInk leading-relaxed">${t.conclusion}</p>
                          </div>
                        </div>
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </section>

          <!-- Calligraphy & Dictation Card -->
          <section class="bg-surface border border-borderWarm rounded-2xl p-5 sm:p-6 shadow-calm space-y-4">
            <div class="flex items-center gap-2 font-heading text-xl font-bold text-ink">
              <i class="ph ph-pen-nib text-accent text-xl shrink-0"></i>
              <span>نماذج الخط العربي ونصائح الإملاء</span>
            </div>

            <div class="space-y-3">
              ${guides.calligraphySamples.map(sample => `
                <div class="bg-paper border border-borderWarm rounded-xl p-4">
                  <div class="text-[11px] font-semibold text-slateCalm mb-2">${sample.source} — للتدريب بخط النسخ وخط الرقعة</div>
                  <div class="poetry-line grid grid-cols-1 sm:grid-cols-2 gap-1 sm:gap-6 text-ink font-bold">
                    <div class="text-right">${sample.lines[0]}</div>
                    <div class="text-left sm:text-right">${sample.lines[1]}</div>
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="pt-3 border-t border-borderWarm/70">
              <div class="text-xs font-bold text-amberAccent mb-2 flex items-center gap-1.5">
                <i class="ph ph-lightbulb text-sm"></i>
                <span>تنبيهات الإملاء (وصايا الحكماء)</span>
              </div>
              <ul class="space-y-1.5 text-xs sm:text-sm text-bodyInk">
                ${guides.dictationTips.map(tip => `
                  <li class="flex items-start gap-2">
                    <i class="ph ph-dot-outline text-accent text-base mt-0.5 shrink-0"></i>
                    <span class="leading-relaxed">${tip}</span>
                  </li>
                `).join('')}
              </ul>
            </div>
          </section>
        </div>
      `;
    }

    /* Station Interactions */
    function selectStation(id) {
      state.currentStationId = id;
      saveState();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleGrammarSheet() {
      uiState.grammarOpen = !uiState.grammarOpen;
      renderApp();
    }

    function toggleWritingTopic(topicId) {
      uiState.openWritingTopic = uiState.openWritingTopic === topicId ? null : topicId;
      renderApp();
    }

    function answerStationMcq(qId, optionIdx) {
      const q = ALL_QUESTIONS.find(item => item.id === qId);
      if (!q) return;
      state.mcqAnswers[qId] = optionIdx;
      if (optionIdx === q.correctIndex) {
        playCorrectSound();
      } else {
        playWrongSound();
      }
      saveState();
      renderApp();
    }

    function updateEssayDraft(qId, value) {
      state.essayDrafts[qId] = value;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function toggleRevealEssay(qId) {
      state.revealedEssays[qId] = !state.revealedEssays[qId];
      saveState();
      renderApp();
    }

    function setEssayStatus(qId, status) {
      state.essayStatus[qId] = status;
      if (status === 'known') {
        playCorrectSound();
        showToast('أحسنت — تم تسجيل إتقانك للسؤال', 'ph-check-circle');
      } else {
        showToast('تمت إضافة السؤال لقائمة المراجعة', 'ph-bookmark-simple');
      }
      saveState();
      renderApp();
    }

    function toggleBookmark(qId) {
      const idx = state.bookmarks.indexOf(qId);
      if (idx >= 0) {
        state.bookmarks.splice(idx, 1);
        showToast('تمت الإزالة من المحفوظات', 'ph-bookmark-simple');
      } else {
        state.bookmarks.push(qId);
        showToast('تم حفظ السؤال في بطاقات المراجعة', 'ph-bookmark-simple');
      }
      saveState();
      renderApp();
    }

    function completeCurrentStation(stationId, nextId) {
      if (!state.completedStations.includes(stationId)) {
        state.completedStations.push(stationId);
      }
      playCompleteSound();
      if (nextId) {
        state.currentStationId = nextId;
        showToast(`أتممت المحطة ${toArabicDigits(stationId)} — ننتقل إلى المحطة ${toArabicDigits(nextId)}`, 'ph-check-circle');
      } else {
        showToast('أتممت جميع المحطات بنجاح — أحسنت', 'ph-seal-check');
      }
      saveState();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* =========================================================================
       8. VIEW 3: COMPREHENSIVE PRACTICE QUIZ (الاختبار الشامل)
       ========================================================================= */
    function renderQuizView() {
      const qz = uiState.quiz;
      const branches = ['الكل', 'القراءة', 'النصوص', 'النحو', 'التعبير والخط'];

      // Setup Screen
      if (!qz.started) {
        const filteredCount = qz.branchFilter === 'الكل'
          ? ALL_MCQS.length
          : ALL_MCQS.filter(q => q.branch === qz.branchFilter).length;

        return `
          <div class="view-enter space-y-5">
            <div class="relative overflow-hidden bg-surface border border-borderWarm rounded-2xl p-5 sm:p-7 shadow-calm space-y-5">
              ${buildMoroccanWatermarkSvg('quiz-head-geo', '#1A2351', '0.035')}
              <div class="relative z-10 space-y-5">
                <div>
                  <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-accentSoft text-accent text-xs font-semibold mb-2">
                    <i class="ph ph-exam text-sm"></i>
                    <span>تدريب شامل بدون أسئلة مكررة</span>
                  </span>
                  <h1 class="font-heading text-2xl sm:text-3xl font-bold text-ink">الاختبار الشامل التفاعلي</h1>
                  <p class="text-sm text-slateCalm mt-1 leading-relaxed">
                    يجمع كل أسئلة الاختيار من متعدد الفريدة من النموذجين الاسترشاديين (${toArabicDigits(ALL_MCQS.length)} سؤالًا). اختر الفرع والنمط المناسب لتركيزك.
                  </p>
                </div>

                <!-- Branch Filter Pills -->
                <div class="space-y-2">
                  <label class="text-xs font-bold text-ink block">اختر الفرع:</label>
                  <div class="flex flex-wrap gap-2">
                    ${branches.map(b => {
                      const count = b === 'الكل' ? ALL_MCQS.length : ALL_MCQS.filter(q => q.branch === b).length;
                      const active = qz.branchFilter === b;
                      return `
                        <button
                          onclick="setQuizFilter('${b}')"
                          class="px-3.5 py-2 rounded-xl text-xs font-semibold border transition-colors min-h-[42px] ${
                            active
                              ? 'bg-accent text-surface border-accent'
                              : 'bg-paper text-slateCalm border-borderWarm hover:text-ink'
                          }"
                        >
                          ${b} (${toArabicDigits(count)})
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>

                <!-- Mode & Timer Options -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                  <div class="bg-paper border border-borderWarm rounded-xl p-3.5 space-y-2">
                    <div class="text-xs font-bold text-ink">نمط التصحيح</div>
                    <div class="grid grid-cols-2 gap-1.5">
                      <button onclick="setQuizOption('instantMode', true)" class="py-2 px-2.5 rounded-lg text-xs font-semibold border transition-colors ${qz.instantMode ? 'bg-accentSoft text-accent border-accent/30' : 'bg-surface text-slateCalm border-borderWarm'}">تصحيح فوري</button>
                      <button onclick="setQuizOption('instantMode', false)" class="py-2 px-2.5 rounded-lg text-xs font-semibold border transition-colors ${!qz.instantMode ? 'bg-accentSoft text-accent border-accent/30' : 'bg-surface text-slateCalm border-borderWarm'}">في النهاية</button>
                    </div>
                  </div>

                  <div class="bg-paper border border-borderWarm rounded-xl p-3.5 space-y-2">
                    <div class="text-xs font-bold text-ink">المؤقت الزمني</div>
                    <div class="grid grid-cols-2 gap-1.5">
                      <button onclick="setQuizOption('useTimer', false)" class="py-2 px-2.5 rounded-lg text-xs font-semibold border transition-colors ${!qz.useTimer ? 'bg-accentSoft text-accent border-accent/30' : 'bg-surface text-slateCalm border-borderWarm'}">بدون مؤقت</button>
                      <button onclick="setQuizOption('useTimer', true)" class="py-2 px-2.5 rounded-lg text-xs font-semibold border transition-colors ${qz.useTimer ? 'bg-accentSoft text-accent border-accent/30' : 'bg-surface text-slateCalm border-borderWarm'}">تفعيل المؤقت</button>
                    </div>
                  </div>
                </div>

                ${state.quizBestPercent !== null ? `
                  <div class="flex items-center gap-2 text-xs text-success bg-successSoft/80 border border-success/20 rounded-xl px-3.5 py-2.5">
                    <i class="ph ph-medal text-base"></i>
                    <span>أعلى نتيجة حققتها سابقًا: <strong>${state.quizBestPercent}%</strong></span>
                  </div>
                ` : ''}

                <button
                  onclick="startQuiz()"
                  class="w-full py-3.5 px-5 rounded-xl bg-accent text-surface text-sm font-bold hover:opacity-95 transition-opacity inline-flex items-center justify-center gap-2 min-h-[50px]"
                >
                  <i class="ph ph-play text-lg"></i>
                  <span>ابدأ الاختبار الآن (${toArabicDigits(filteredCount)} سؤالًا)</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }

      // Finished Summary Screen
      if (qz.finished) {
        const total = qz.questions.length;
        let correctCount = 0;
        const missedQuestions = [];
        const branchStats = {};

        qz.questions.forEach(q => {
          if (!branchStats[q.branch]) branchStats[q.branch] = { total: 0, correct: 0 };
          branchStats[q.branch].total++;
          if (qz.answers[q.id] === q.correctIndex) {
            correctCount++;
            branchStats[q.branch].correct++;
          } else {
            missedQuestions.push(q);
          }
        });

        const pct = total > 0 ? Math.round((correctCount / total) * 100) : 0;

        return `
          <div class="view-enter space-y-5">
            <div class="bg-surface border border-borderWarm rounded-2xl p-6 shadow-calm text-center space-y-4">
              <div class="w-14 h-14 mx-auto rounded-2xl ${pct >= 80 ? 'bg-successSoft text-success' : 'bg-accentSoft text-accent'} flex items-center justify-center">
                <i class="ph ${pct >= 80 ? 'ph-seal-check' : 'ph-chart-bar'} text-3xl"></i>
              </div>
              <div>
                <h2 class="font-heading text-2xl sm:text-3xl font-bold text-ink">ملخص نتيجة الاختبار</h2>
                <p class="text-sm text-slateCalm mt-1">
                  ${pct >= 85 ? 'أداء متميز وتركيز عالٍ — أحسنت.' : pct >= 65 ? 'مستوى جيد جدًا، مراجعة الأخطاء سترفع نتيجتك للدرجة النهائية.' : 'بداية طيبة، راجع الأسئلة التي أخطأت فيها وجرّب مرة أخرى.'}
                </p>
              </div>

              <div class="flex items-center justify-center gap-6 py-3">
                <div>
                  <div class="text-3xl font-bold text-accent tabular-nums">${pct}%</div>
                  <div class="text-xs text-slateCalm">النسبة المئوية</div>
                </div>
                <div class="w-px h-10 bg-borderWarm"></div>
                <div>
                  <div class="text-3xl font-bold text-ink tabular-nums">${correctCount} / ${total}</div>
                  <div class="text-xs text-slateCalm">إجابات صحيحة</div>
                </div>
                ${qz.useTimer ? `
                  <div class="w-px h-10 bg-borderWarm"></div>
                  <div>
                    <div class="text-2xl font-bold text-ink tabular-nums">${formatTime(qz.secondsElapsed)}</div>
                    <div class="text-xs text-slateCalm">الوقت المستغرق</div>
                  </div>
                ` : ''}
              </div>

              <!-- Branch Breakdown -->
              <div class="text-right bg-paper border border-borderWarm rounded-xl p-4 space-y-2.5">
                <div class="text-xs font-bold text-ink mb-1">تفصيل الأداء حسب الفرع</div>
                ${Object.entries(branchStats).map(([branch, bStat]) => {
                  const bPct = Math.round((bStat.correct / bStat.total) * 100);
                  return `
                    <div class="space-y-1">
                      <div class="flex items-center justify-between text-xs">
                        <span class="font-semibold text-ink">${branch}</span>
                        <span class="text-slateCalm tabular-nums">${bStat.correct} / ${bStat.total} (${bPct}%)</span>
                      </div>
                      <div class="w-full h-2 bg-borderWarm/70 rounded-full overflow-hidden">
                        <div class="h-full ${bPct >= 75 ? 'bg-success' : 'bg-accent'} rounded-full" style="width: ${bPct}%"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>

              <div class="flex flex-wrap items-center justify-center gap-2.5 pt-2">
                ${missedQuestions.length > 0 ? `
                  <button
                    onclick="retryMissedQuiz()"
                    class="flex-1 sm:flex-none px-5 py-3 rounded-xl bg-amberAccent text-surface text-sm font-semibold hover:opacity-95 min-h-[48px] inline-flex items-center justify-center gap-2"
                  >
                    <i class="ph ph-arrows-clockwise text-base"></i>
                    <span>إعادة التدريب على الأخطاء (${toArabicDigits(missedQuestions.length)})</span>
                  </button>
                ` : ''}
                <button
                  onclick="resetQuizToSetup()"
                  class="flex-1 sm:flex-none px-5 py-3 rounded-xl bg-paper border border-borderWarm text-ink hover:bg-accentSoft hover:text-accent text-sm font-semibold min-h-[48px]"
                >
                  اختبار جديد
                </button>
              </div>
            </div>

            <!-- Review Missed Questions List -->
            ${missedQuestions.length > 0 ? `
              <div class="space-y-3">
                <h3 class="font-heading text-xl font-bold text-ink">مراجعة الأسئلة التي تحتاج تركيزًا</h3>
                ${missedQuestions.map((q, idx) => `
                  <div class="bg-surface border border-borderWarm rounded-2xl p-4 shadow-calm space-y-2">
                    <div class="text-[11px] font-semibold text-slateCalm">${q.source}</div>
                    <div class="text-sm font-bold text-ink">${toArabicDigits(idx + 1)}. ${q.prompt}</div>
                    <div class="text-xs text-danger">إجابتك: ${qz.answers[q.id] !== undefined ? q.options[qz.answers[q.id]] : 'لم تُجب'}</div>
                    <div class="text-xs font-semibold text-success">الإجابة الصحيحة: ${q.options[q.correctIndex]}</div>
                    <p class="text-xs text-slateCalm bg-paper rounded-lg p-2.5 border border-borderWarm/70">${q.explanation}</p>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }

      // Active Quiz Question Screen
      const q = qz.questions[qz.currentIndex];
      const chosen = qz.answers[q.id];
      const answered = chosen !== undefined;
      const showValidation = qz.instantMode && answered;
      const isCorrect = answered && chosen === q.correctIndex;
      const arabicLetters = ['أ', 'ب', 'ج', 'د'];
      const progressPct = Math.round(((qz.currentIndex + 1) / qz.questions.length) * 100);

      return `
        <div class="view-enter space-y-4">
          <!-- Quiz Top Status Bar -->
          <div class="bg-surface border border-borderWarm rounded-2xl p-4 shadow-calm space-y-2.5">
            <div class="flex items-center justify-between gap-2 text-xs font-semibold">
              <span class="text-ink">السؤال ${toArabicDigits(qz.currentIndex + 1)} من ${toArabicDigits(qz.questions.length)}</span>
              <div class="flex items-center gap-3">
                ${qz.useTimer ? `<span id="quiz-timer-display" class="inline-flex items-center gap-1 text-accent tabular-nums"><i class="ph ph-timer text-sm"></i> ${formatTime(qz.secondsElapsed)}</span>` : ''}
                <button onclick="resetQuizToSetup()" class="text-slateCalm hover:text-danger">إنهاء</button>
              </div>
            </div>
            <div class="w-full h-2 bg-borderWarm/70 rounded-full overflow-hidden">
              <div class="h-full bg-accent rounded-full transition-all duration-300" style="width: ${progressPct}%"></div>
            </div>
          </div>

          <!-- Current Question Card -->
          <div class="bg-surface border border-borderWarm rounded-2xl p-5 sm:p-6 shadow-calm space-y-5">
            <div class="flex items-center justify-between gap-2">
              <span class="px-2.5 py-1 rounded-lg bg-accentSoft text-accent text-xs font-semibold">${q.branch}</span>
              <span class="text-xs text-slateCalm">${q.source}</span>
            </div>

            <h2 class="text-base sm:text-lg font-bold text-ink leading-relaxed">${q.prompt}</h2>

            <div class="space-y-2.5">
              ${q.options.map((opt, idx) => {
                let cls = 'bg-paper border-borderWarm text-bodyInk hover:border-accent/50';
                let badge = `<span class="w-7 h-7 rounded-lg bg-surface border border-borderWarm text-xs font-bold text-slateCalm flex items-center justify-center shrink-0">${arabicLetters[idx]}</span>`;

                if (showValidation) {
                  if (idx === q.correctIndex) {
                    cls = 'bg-successSoft border-success/45 text-success font-semibold';
                    badge = `<span class="w-7 h-7 rounded-lg bg-success text-surface flex items-center justify-center shrink-0"><i class="ph ph-check text-sm"></i></span>`;
                  } else if (idx === chosen && idx !== q.correctIndex) {
                    cls = 'bg-dangerSoft border-danger/40 text-danger';
                    badge = `<span class="w-7 h-7 rounded-lg bg-danger text-surface flex items-center justify-center shrink-0"><i class="ph ph-x text-sm"></i></span>`;
                  } else {
                    cls = 'bg-paper/60 border-borderWarm/60 text-slateCalm opacity-70';
                  }
                } else if (chosen === idx) {
                  cls = 'bg-accentSoft border-accent text-accent font-semibold';
                  badge = `<span class="w-7 h-7 rounded-lg bg-accent text-surface text-xs font-bold flex items-center justify-center shrink-0">${arabicLetters[idx]}</span>`;
                }

                return `
                  <button
                    onclick="selectQuizAnswer('${q.id}', ${idx})"
                    class="w-full text-right px-4 py-3 rounded-xl border transition-all flex items-center gap-3 min-h-[50px] ${cls}"
                  >
                    ${badge}
                    <span class="text-sm leading-relaxed">${opt}</span>
                  </button>
                `;
              }).join('')}
            </div>

            ${showValidation ? `
              <div class="rounded-xl p-3.5 border text-sm leading-relaxed space-y-1 ${isCorrect ? 'bg-successSoft/75 border-success/25' : 'bg-dangerSoft/75 border-danger/25'}">
                <div class="font-bold flex items-center gap-1.5 ${isCorrect ? 'text-success' : 'text-danger'}">
                  <i class="ph ${isCorrect ? 'ph-check-circle' : 'ph-info'} text-base"></i>
                  <span>${isCorrect ? 'إجابة صحيحة — أحسنت التركيز' : 'إجابة غير دقيقة — راجع التوضيح أدناه'}</span>
                </div>
                <p class="text-xs sm:text-sm text-bodyInk">${q.explanation}</p>
              </div>
            ` : ''}

            <!-- Quiz Navigation Controls -->
            <div class="pt-3 border-t border-borderWarm flex items-center justify-between gap-3">
              <button
                onclick="moveQuizQuestion(-1)"
                ${qz.currentIndex === 0 ? 'disabled' : ''}
                class="px-4 py-2.5 rounded-xl border border-borderWarm bg-paper text-sm font-semibold text-ink disabled:opacity-40 min-h-[44px] inline-flex items-center gap-1.5"
              >
                <i class="ph ph-arrow-right"></i>
                <span>السابق</span>
              </button>

              ${qz.currentIndex < qz.questions.length - 1 ? `
                <button
                  onclick="moveQuizQuestion(1)"
                  class="px-5 py-2.5 rounded-xl bg-accent text-surface text-sm font-semibold hover:opacity-95 min-h-[44px] inline-flex items-center gap-1.5"
                >
                  <span>التالي</span>
                  <i class="ph ph-arrow-left"></i>
                </button>
              ` : `
                <button
                  onclick="finishQuiz()"
                  class="px-5 py-2.5 rounded-xl bg-success text-surface text-sm font-semibold hover:opacity-95 min-h-[44px] inline-flex items-center gap-1.5"
                >
                  <i class="ph ph-check-circle"></i>
                  <span>عرض النتيجة</span>
                </button>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function setQuizFilter(branch) {
      uiState.quiz.branchFilter = branch;
      renderApp();
    }

    function setQuizOption(key, val) {
      uiState.quiz[key] = val;
      renderApp();
    }

    function startQuiz(customQuestions = null) {
      const qz = uiState.quiz;
      const pool = customQuestions || (qz.branchFilter === 'الكل'
        ? [...ALL_MCQS]
        : ALL_MCQS.filter(q => q.branch === qz.branchFilter));

      qz.questions = pool;
      qz.answers = {};
      qz.currentIndex = 0;
      qz.started = true;
      qz.finished = false;
      qz.secondsElapsed = 0;

      if (qz.timerInterval) clearInterval(qz.timerInterval);
      if (qz.useTimer) {
        qz.timerInterval = setInterval(() => {
          qz.secondsElapsed++;
          const el = document.getElementById('quiz-timer-display');
          if (el) el.innerHTML = `<i class="ph ph-timer text-sm"></i> ${formatTime(qz.secondsElapsed)}`;
        }, 1000);
      }

      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectQuizAnswer(qId, idx) {
      const qz = uiState.quiz;
      if (qz.instantMode && qz.answers[qId] !== undefined) return;
      qz.answers[qId] = idx;
      const q = qz.questions.find(item => item.id === qId);
      if (qz.instantMode && q) {
        if (idx === q.correctIndex) playCorrectSound();
        else playWrongSound();
      }
      renderApp();
    }

    function moveQuizQuestion(delta) {
      const qz = uiState.quiz;
      const next = qz.currentIndex + delta;
      if (next >= 0 && next < qz.questions.length) {
        qz.currentIndex = next;
        renderApp();
      }
    }

    function finishQuiz() {
      const qz = uiState.quiz;
      if (qz.timerInterval) {
        clearInterval(qz.timerInterval);
        qz.timerInterval = null;
      }
      qz.finished = true;

      let correct = 0;
      qz.questions.forEach(q => {
        if (qz.answers[q.id] === q.correctIndex) correct++;
      });
      const pct = Math.round((correct / qz.questions.length) * 100);
      if (state.quizBestPercent === null || pct > state.quizBestPercent) {
        state.quizBestPercent = pct;
        saveState();
      }
      playCompleteSound();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function retryMissedQuiz() {
      const qz = uiState.quiz;
      const missed = qz.questions.filter(q => qz.answers[q.id] !== q.correctIndex);
      if (missed.length > 0) startQuiz(missed);
    }

    function resetQuizToSetup() {
      const qz = uiState.quiz;
      if (qz.timerInterval) {
        clearInterval(qz.timerInterval);
        qz.timerInterval = null;
      }
      qz.started = false;
      qz.finished = false;
      renderApp();
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function getOrderedFlashcards() {
      const map = new Map(FLASHCARDS.map(c => [c.id, c]));

      FLASHCARDS.forEach(c => {
        if (!ordered.includes(c)) ordered.push(c);
      });
      return ordered;
    }

    function getFilteredFlashcards() {
      const ordered = getOrderedFlashcards();
      if (uiState.flashcardFilter === 'all') return ordered;
      if (uiState.flashcardFilter === 'review') {
        return ordered.filter(c => state.flashcardStatus[c.id] === 'review');
      }
      return ordered.filter(c => c.theme === uiState.flashcardFilter);
    }

    function getFilterCount(filterKey) {
      if (filterKey === 'all') return FLASHCARDS.length;
      if (filterKey === 'review') return FLASHCARDS.filter(c => state.flashcardStatus[c.id] === 'review').length;
      return FLASHCARDS.filter(c => c.theme === filterKey).length;
    }

        { key: 'antonym',    label: FLASHCARD_THEMES.antonym.label,    dot: FLASHCARD_THEMES.antonym.accent },

    /* ==================== MODE A: PHYSICAL 3D STACKED DECK MODE ==================== */

                          <span
                            class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold text-surface"

                  <!-- BACK FACE -->
                  <div
                    class="flip-face flip-back flex flex-col justify-between"
                    style="background-color: ${theme.backBg}; border: 2px solid ${theme.accent};"

                    <!-- Colored Header Band -->
                    <div
                      class="px-5 py-3 flex flex-wrap items-center justify-between gap-2 text-surface shrink-0"
                      style="background-color: ${theme.accent};"
                    >
                      <span class="inline-flex items-center gap-1.5 text-xs font-bold">
                        <i class="ph ph-seal-check text-base"></i>
                        <span>الإجابة النموذجية — ${theme.label}</span>

                      <span class="text-[11px] font-medium opacity-95">${card.subtitle}</span>

              <button
                onclick="markFlashcard('${card.id}', 'known')"

                  cardStatus === 'known'

                <span>حفظتها جيدًا</span>
              </button>
              <button
                onclick="markFlashcard('${card.id}', 'review')"
                class="py-3 px-4 rounded-xl text-xs sm:text-sm font-semibold border transition-colors min-h-[48px] inline-flex items-center justify-center gap-2 ${
                  cardStatus === 'review'
                    ? 'bg-amberAccent text-surface border-amberAccent'
                    : 'bg-amberSoft text-amberAccent border-amberAccent/30 hover:bg-amberAccent hover:text-surface'
                }"
              >
                <i class="ph ph-clock-counter-clockwise text-base"></i>
                <span>للمراجعة لاحقًا</span>
              </button>
            </div>

            <!-- Previous / Shuffle / Next Row -->
            <div class="flex items-center justify-between gap-2 pt-3 border-t border-borderWarm/70">
              <button
                onclick="stepFlashcard(-1)"
                class="px-4 py-2.5 rounded-xl bg-paper border border-borderWarm text-xs font-semibold text-ink hover:border-accent/40 min-h-[44px] inline-flex items-center gap-1.5"
              >
                <i class="ph ph-arrow-right text-sm"></i>
                <span>السابقة</span>
              </button>

              <button
                onclick="shuffleFlashcards()"
                class="px-3.5 py-2.5 rounded-xl bg-paper border border-borderWarm text-xs font-semibold text-slateCalm hover:text-accent hover:border-accent/40 min-h-[44px] inline-flex items-center gap-1.5 transition-colors"
                title="خلط ترتيب البطاقات"
              >
                <i class="ph ph-shuffle text-sm"></i>
                <span>خلط البطاقات</span>
              </button>

              <button
                onclick="stepFlashcard(1)"
                class="px-4 py-2.5 rounded-xl bg-paper border border-borderWarm text-xs font-semibold text-ink hover:border-accent/40 min-h-[44px] inline-flex items-center gap-1.5"
              >
                <span>التالية</span>
                <i class="ph ph-arrow-left text-sm"></i>
              </button>

                        background-color: ${dotColor};

              </p>
            </div>
          </div>
        </div>
      `;

    /* ==================== MODE B: COLORFUL 3D FLIP GRID VIEW ==================== */
    function renderColoredGridMode(cards) {
      return `
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          ${cards.map((card, idx) => {
            const theme = FLASHCARD_THEMES[card.theme] || FLASHCARD_THEMES.synonym;
            const isFlipped = !!uiState.flippedGridCards[card.id];
            const cardStatus = state.flashcardStatus[card.id];
