                    aria-label="اضغط لقلب بطاقة ${card.front}"
                    class="flip-card grid-flip-card shadow-calm hover:shadow-calmHover ${isFlipped ? 'is-flipped' : ''}"
                  >
                    <!-- GRID CARD FRONT FACE -->
                    <div
                      class="flip-face flip-front flex flex-col justify-between"
                      style="background-color: ${theme.bg}; border: 1.5px solid ${theme.border};"
                    >
                      <!-- Colored Top Strip -->
                      <div class="h-1.5 w-full shrink-0" style="background-color: ${theme.accent};"></div>
                      ${buildMoroccanCornerStar(theme.accent, 'bottom-2 left-2', '0.10')}

                      <div class="relative z-10 p-4 flex-1 flex flex-col justify-between gap-3">
                        <div class="flex items-center justify-between gap-2">
                          <span
                            class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-bold text-surface"
                            style="background-color: ${theme.accent};"
                          >
                            <i class="ph ${theme.icon} text-xs"></i>
                            <span>${theme.label}</span>
                          </span>
                          <div class="flex items-center gap-1.5">
                            <span id="grid-status-badge-${card.id}">
                              ${renderGridStatusIcon(cardStatus)}
                            </span>
                            <span
                              class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-surface"
                              style="border: 1px solid ${theme.border}; color: ${theme.darkText};"
                            >
                              ${toArabicDigits(idx + 1)}
                            </span>
                          </div>
                        </div>

                        <div class="text-center py-3 space-y-1.5">
                          <h3 class="font-heading text-xl font-bold text-ink leading-snug">${card.front}</h3>
                          <div class="text-[11px] font-medium" style="color: ${theme.darkText};">${card.subtitle}</div>
                        </div>

                        <div
                          class="rounded-xl py-2 px-3 bg-surface/95 flex items-center justify-center gap-1.5 text-xs font-bold"
                          style="border: 1px solid ${theme.border}; color: ${theme.accent};"
                        >
                          <i class="ph ph-arrows-clockwise text-sm"></i>
                          <span>اضغط لقلب البطاقة</span>
                        </div>
                      </div>
                    </div>

                    <!-- GRID CARD BACK FACE -->
                    <div
                      class="flip-face flip-back flex flex-col justify-between"
                      style="background-color: ${theme.backBg}; border: 2px solid ${theme.accent};"
                    >
                      <!-- Solid Header Strip -->
                      <div
                        class="px-4 py-2 flex items-center justify-between gap-2 text-surface shrink-0"
                        style="background-color: ${theme.accent};"
                      >
                        <span class="text-[11px] font-bold inline-flex items-center gap-1">
                          <i class="ph ph-seal-check text-xs"></i>
                          <span>${theme.label}</span>
                        </span>
                        <span class="text-[10px] opacity-95">اضغط للعودة</span>
                      </div>

                      <div class="relative z-10 p-3.5 flex-1 flex flex-col justify-between gap-2.5">
                        <!-- White Answer Plaque -->
                        <div class="bg-surface rounded-xl p-3 text-center" style="border: 1px solid ${theme.border};">
                          <div class="font-serifAr text-lg font-bold text-ink leading-relaxed">${card.back}</div>
                        </div>

                        <!-- Note Box -->
                        <p
                          class="text-xs text-bodyInk leading-relaxed bg-surface/90 rounded-lg p-2.5"
                          style="border: 1px solid ${theme.border}; border-right: 3px solid ${theme.accent};"
                        >
                          ${card.note}
                        </p>

                        <!-- Quick Status Buttons -->
                        <div class="grid grid-cols-2 gap-2 pt-0.5" onclick="event.stopPropagation()">
                          <button
                            id="grid-btn-known-${card.id}"
                            onclick="markGridFlashcard('${card.id}', 'known')"
                            class="py-2 px-2 rounded-xl text-xs font-semibold border transition-colors min-h-[38px] inline-flex items-center justify-center gap-1 ${
                              cardStatus === 'known'
                                ? 'bg-success text-surface border-success'
                                : 'bg-surface text-success border-success/30 hover:bg-successSoft'
                            }"
                          >
                            <i class="ph ph-check text-xs"></i>
                            <span>حفظتها</span>
                          </button>
                          <button
                            id="grid-btn-review-${card.id}"
                            onclick="markGridFlashcard('${card.id}', 'review')"
                            class="py-2 px-2 rounded-xl text-xs font-semibold border transition-colors min-h-[38px] inline-flex items-center justify-center gap-1 ${
                              cardStatus === 'review'
                                ? 'bg-amberAccent text-surface border-amberAccent'
                                : 'bg-surface text-amberAccent border-amberAccent/35 hover:bg-amberSoft'
                            }"
                          >
                            <i class="ph ph-clock-counter-clockwise text-xs"></i>
                            <span>للمراجعة</span>
                          </button>
                        </div>
                      </div>
                    </div>
                  </article>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderGridStatusIcon(cardStatus) {
      if (cardStatus === 'known') {
        return `<span class="w-6 h-6 rounded-full bg-successSoft text-success border border-success/25 inline-flex items-center justify-center" title="محفوظة"><i class="ph ph-check text-xs"></i></span>`;
      }
      if (cardStatus === 'review') {
        return `<span class="w-6 h-6 rounded-full bg-amberSoft text-amberAccent border border-amberAccent/30 inline-flex items-center justify-center" title="للمراجعة"><i class="ph ph-clock-counter-clockwise text-xs"></i></span>`;
      }
      return '';
    }

    function renderBookmarksPanel(savedIds) {
      if (savedIds.length === 0) {
        return `
          <div class="bg-surface border border-borderWarm rounded-2xl p-8 text-center space-y-3 shadow-calm">
            <div class="w-12 h-12 mx-auto rounded-2xl bg-amberSoft text-amberAccent flex items-center justify-center">
              <i class="ph ph-bookmark-simple text-2xl"></i>
            </div>
            <h3 class="font-heading text-2xl font-bold text-ink">لا توجد أسئلة محفوظة حاليًا</h3>
            <p class="text-xs sm:text-sm text-slateCalm max-w-md mx-auto leading-relaxed">
              أثناء المذاكرة داخل المحطات، يمكنك الضغط على أيقونة الحفظ أو اختيار «أحتاج مراجعتها» في الأسئلة المقالية لتظهر هنا تلقائيًا.
            </p>
            <button onclick="switchView('station')" class="px-5 py-2.5 rounded-xl bg-accent text-surface text-xs sm:text-sm font-semibold min-h-[44px]">
              الذهاب إلى المحطات
            </button>
          </div>
        `;
      }

      const items = savedIds.map(id => ALL_QUESTIONS.find(q => q.id === id)).filter(Boolean);

      return `
        <div class="space-y-3.5">
          ${items.map(q => `
            <article class="bg-surface border border-borderWarm rounded-2xl p-4 sm:p-5 shadow-calm space-y-3">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <span class="inline-block px-2.5 py-0.5 rounded-md bg-accentSoft text-accent text-[11px] font-semibold mb-1">
                    المحطة ${toArabicDigits(q.stationId)}: ${q.stationTitle}
                  </span>
                  <h3 class="text-sm sm:text-base font-bold text-ink leading-relaxed">${q.prompt}</h3>
                </div>
              </div>

              <div class="bg-paper border border-borderWarm rounded-xl p-3.5 text-xs sm:text-sm space-y-1">
                ${q.type === 'mcq' ? `
                  <div class="font-bold text-success">الإجابة الصحيحة: ${q.options[q.correctIndex]}</div>
                  <p class="text-slateCalm leading-relaxed">${q.explanation}</p>
                ` : `
                  <div class="font-bold text-accent">الإجابة النموذجية:</div>
                  <p class="text-bodyInk leading-relaxed">${q.modelAnswer}</p>
                `}
              </div>

              <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
                <button
                  onclick="switchView('station', { stationId: ${q.stationId}, scrollToQuestionId: '${q.id}' })"
                  class="inline-flex items-center gap-1.5 text-xs font-semibold text-accent hover:underline py-1.5"
                >
                  <i class="ph ph-arrow-square-out text-sm"></i>
                  <span>فتح السؤال داخل المحطة</span>
                </button>
                <button
                  onclick="removeSavedQuestion('${q.id}')"
                  class="inline-flex items-center gap-1 text-xs font-semibold text-slateCalm hover:text-success py-1.5 px-2.5 rounded-lg hover:bg-successSoft transition-colors"
                >
                  <i class="ph ph-check text-sm"></i>
                  <span>تمت المراجعة (إزالة)</span>
                </button>
              </div>
            </article>
          `).join('')}
        </div>
      `;
    }

    /* ==================== FLASHCARD DOM-NATIVE 3D FLIP INTERACTIONS ==================== */
    function setReviewSubTab(tab) {
      uiState.reviewSubTab = tab;
      renderApp();
    }

    function setFlashcardMode(mode) {
      uiState.flashcardMode = mode;
      renderApp();
    }

    function setFlashcardFilter(filterKey) {
      uiState.flashcardFilter = filterKey;
      uiState.flashcardIndex = 0;
      uiState.flashcardFlipped = false;
      renderApp();
    }

    /* Direct DOM toggle for Deck Card so 3D flip + sheen sweep animate seamlessly */
    function flipCurrentCard() {
      if (uiState.justSwiped || uiState.deckTransitionLock) return;
      uiState.flashcardFlipped = !uiState.flashcardFlipped;
      playFlipSound();

      const cardEl = document.getElementById('deck-flip-card');
      const liftEl = document.getElementById('deck-flip-lift');
      const stackWrapper = document.getElementById('deck-stack-wrapper');

      if (cardEl) {
        cardEl.classList.toggle('is-flipped', uiState.flashcardFlipped);
      }
      if (liftEl) {
        liftEl.classList.remove('is-lifting');
        void liftEl.offsetWidth;
        liftEl.classList.add('is-lifting');
      }
      if (stackWrapper) {
        stackWrapper.classList.add('deck-nudge');
        clearTimeout(stackWrapper._nudgeTimer);
        stackWrapper._nudgeTimer = setTimeout(() => {
          stackWrapper.classList.remove('deck-nudge');
        }, 420);
      }
    }

    /* Directional Slide Transition for Next / Previous Card */
    function stepFlashcard(delta) {
      const cards = getFilteredFlashcards();
      if (cards.length <= 1 || uiState.deckTransitionLock) return;

      uiState.deckTransitionLock = true;
      playFlipSound();

      const stage = document.getElementById('deck-active-stage');
      const outClass = delta > 0 ? 'anim-slide-out-next' : 'anim-slide-out-prev';
      const inClass = delta > 0 ? 'anim-slide-in-next' : 'anim-slide-in-prev';

      if (stage) {
        stage.classList.add(outClass);
        setTimeout(() => {
          uiState.flashcardIndex = (uiState.flashcardIndex + delta + cards.length) % cards.length;
          uiState.flashcardFlipped = false;
          uiState.deckEnterAnim = inClass;
          uiState.deckTransitionLock = false;
          renderApp();
        }, 165);
      } else {
        uiState.flashcardIndex = (uiState.flashcardIndex + delta + cards.length) % cards.length;
        uiState.flashcardFlipped = false;
        uiState.deckTransitionLock = false;
        renderApp();
      }
    }

    function jumpToFlashcard(idx) {
      if (idx === uiState.flashcardIndex || uiState.deckTransitionLock) return;
      const delta = idx > uiState.flashcardIndex ? 1 : -1;
      uiState.deckEnterAnim = delta > 0 ? 'anim-slide-in-next' : 'anim-slide-in-prev';
      uiState.flashcardIndex = idx;
      uiState.flashcardFlipped = false;
      playFlipSound();
      renderApp();
    }

    function shuffleFlashcards() {
      const arr = [...uiState.flashcardOrder];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      uiState.flashcardOrder = arr;
      uiState.flashcardIndex = 0;
      uiState.flashcardFlipped = false;
      uiState.deckEnterAnim = 'anim-slide-in-next';
      playFlipSound();
      renderApp();
      showToast('تم خلط ترتيب البطاقات بنجاح', 'ph-shuffle');
    }

    function markFlashcard(cardId, status) {
      state.flashcardStatus[cardId] = status;
      if (status === 'known') playCorrectSound();
      else playFlipSound();
      saveState();

      const cards = getFilteredFlashcards();
      if (cards.length > 0) {
        uiState.flashcardIndex = (uiState.flashcardIndex + 1) % cards.length;
      }
      uiState.flashcardFlipped = false;
      uiState.deckEnterAnim = 'anim-slide-in-next';
      renderApp();
    }

    /* Direct DOM toggle for Individual Grid Card so 3D flip plays smoothly */
    function flipGridCard(cardId) {
      uiState.flippedGridCards[cardId] = !uiState.flippedGridCards[cardId];
      playFlipSound();

      const cardEl = document.getElementById(`grid-flip-card-${cardId}`);
      const liftEl = document.getElementById(`grid-flip-lift-${cardId}`);
      if (cardEl) {
        cardEl.classList.toggle('is-flipped', uiState.flippedGridCards[cardId]);
      }
      if (liftEl) {
        liftEl.classList.remove('is-lifting');
        void liftEl.offsetWidth;
        liftEl.classList.add('is-lifting');
      }

      const btn = document.getElementById('grid-flip-all-btn');
      if (btn) {
        const allFlipped = areAllGridCardsFlipped(getFilteredFlashcards());
        btn.innerHTML = `<i class="ph ph-arrows-clockwise text-sm"></i><span>${allFlipped ? 'إعادة كل البطاقات' : 'قلب كل البطاقات'}</span>`;
      }
    }

    function areAllGridCardsFlipped(cards) {
      return cards.length > 0 && cards.every(c => !!uiState.flippedGridCards[c.id]);
    }

    function toggleAllGridCards() {
      const cards = getFilteredFlashcards();
      const shouldUnflip = areAllGridCardsFlipped(cards);
      playFlipSound();

      cards.forEach((c, idx) => {
        uiState.flippedGridCards[c.id] = !shouldUnflip;
        const cardEl = document.getElementById(`grid-flip-card-${c.id}`);
        if (cardEl) {
          setTimeout(() => {
            cardEl.classList.toggle('is-flipped', !shouldUnflip);
          }, Math.min(idx * 25, 220));
        }
      });

      const btn = document.getElementById('grid-flip-all-btn');
      if (btn) {
        btn.innerHTML = `<i class="ph ph-arrows-clockwise text-sm"></i><span>${!shouldUnflip ? 'إعادة كل البطاقات' : 'قلب كل البطاقات'}</span>`;
      }
    }

    function markGridFlashcard(cardId, status) {
      state.flashcardStatus[cardId] = status;
      if (status === 'known') {
        playCorrectSound();
        showToast('أحسنت — تم حفظ البطاقة', 'ph-check-circle');
      } else {
        showToast('أضيفت البطاقة لقائمة المراجعة', 'ph-clock-counter-clockwise');
      }
      saveState();

      if (uiState.flashcardFilter === 'review') {
        renderApp();
        return;
      }

      const badgeEl = document.getElementById(`grid-status-badge-${cardId}`);
      if (badgeEl) badgeEl.innerHTML = renderGridStatusIcon(status);

      const knownBtn = document.getElementById(`grid-btn-known-${cardId}`);
      const reviewBtn = document.getElementById(`grid-btn-review-${cardId}`);
      if (knownBtn) {
        knownBtn.className = `py-2 px-2 rounded-xl text-xs font-semibold border transition-colors min-h-[38px] inline-flex items-center justify-center gap-1 ${
          status === 'known'
            ? 'bg-success text-surface border-success'
            : 'bg-surface text-success border-success/30 hover:bg-successSoft'
        }`;
      }
      if (reviewBtn) {
        reviewBtn.className = `py-2 px-2 rounded-xl text-xs font-semibold border transition-colors min-h-[38px] inline-flex items-center justify-center gap-1 ${
          status === 'review'
            ? 'bg-amberAccent text-surface border-amberAccent'
            : 'bg-surface text-amberAccent border-amberAccent/35 hover:bg-amberSoft'
        }`;
      }

      const summaryEl = document.getElementById('fc-mastery-summary');
      if (summaryEl) {
        const knownCount = FLASHCARDS.filter(c => state.flashcardStatus[c.id] === 'known').length;
        const reviewCount = FLASHCARDS.filter(c => state.flashcardStatus[c.id] === 'review').length;
        summaryEl.innerHTML = `حفظت <strong class="text-success">${toArabicDigits(knownCount)}</strong> من ${toArabicDigits(FLASHCARDS.length)} بطاقة${
          reviewCount > 0 ? ` • <strong class="text-amberAccent">${toArabicDigits(reviewCount)}</strong> للمراجعة` : ''
        }`;
      }
    }

    /* Touch Swipe Support for Mobile Deck */
    function handleDeckTouchStart(e) {
      if (!e.touches || e.touches.length !== 1) return;
      uiState.touchStartX = e.touches[0].clientX;
      uiState.touchStartY = e.touches[0].clientY;
    }

    function handleDeckTouchEnd(e) {
      if (!e.changedTouches || e.changedTouches.length !== 1) return;
      const dx = e.changedTouches[0].clientX - uiState.touchStartX;
      const dy = e.changedTouches[0].clientY - uiState.touchStartY;

      if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.25) {
        uiState.justSwiped = true;
        setTimeout(() => { uiState.justSwiped = false; }, 260);
        if (dx < 0) stepFlashcard(1);
        else stepFlashcard(-1);
      }
    }

    /* Keyboard Shortcuts for Flashcards Deck */
    document.addEventListener('keydown', (e) => {
      const tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

      const isDeckActive =
        state.currentView === 'review' &&
        uiState.reviewSubTab === 'flashcards' &&
        uiState.flashcardMode === 'flip';

      if (!isDeckActive) return;

      if (e.key === ' ' || (e.key === 'Enter' && tag !== 'BUTTON')) {
        e.preventDefault();
        flipCurrentCard();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        stepFlashcard(1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        stepFlashcard(-1);
      }
    });

    function removeSavedQuestion(qId) {
      state.bookmarks = state.bookmarks.filter(id => id !== qId);
      if (state.essayStatus[qId] === 'review') {
        state.essayStatus[qId] = 'known';
      }
      saveState();
      renderApp();
      showToast('تمت إزالة السؤال من قائمة المراجعة', 'ph-check-circle');
    }

    /* =========================================================================
       10. MASTER RENDER & UTILITIES
       ========================================================================= */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;

      try {
        if (state.currentView === 'plan') {
          root.innerHTML = renderPlanView();
        } else if (state.currentView === 'station') {
          root.innerHTML = renderStationView();
        } else if (state.currentView === 'quiz') {
          root.innerHTML = renderQuizView();
        } else if (state.currentView === 'review') {
          root.innerHTML = renderReviewView();
        }
        updateGlobalChrome();
      } catch (err) {
        root.innerHTML = `
          <div class="bg-dangerSoft border border-danger/30 rounded-2xl p-6 text-center space-y-2">
            <div class="font-bold text-danger">حدث خطأ غير متوقع أثناء عرض الصفحة</div>
            <button onclick="switchView('plan')" class="px-4 py-2 rounded-xl bg-accent text-surface text-xs font-semibold">العودة للرئيسية</button>
          </div>
        `;
      }
    }

    // Initialize Application
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
